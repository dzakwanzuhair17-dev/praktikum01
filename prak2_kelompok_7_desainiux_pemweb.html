
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Form Pemesanan Barang</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #eee;
    margin: 15px;
    color: #222;
}
.container {
    max-width: 850px;
    margin: auto;
    padding: 18px;
    background: #fff;
    border: 1px solid #999;
}
nav {
    display: flex;
    justify-content: space-around;
    flex-wrap: wrap;
    gap: 8px;
    border: 1px solid #777;
    padding: 10px 3px;
    margin-bottom: 25px;
}
nav a {
    color: #222;
    font-size: 12px;
    text-decoration: none;
}
.product {
    display: flex;
    align-items: flex-start;
    gap: 20px;
}
.photo-area {
    width: 145px;
    flex-shrink: 0;
}
.photo {
    width: 140px;
    height: 140px;
    border: 1px solid #222;
    box-sizing: border-box;
    background:
      linear-gradient(45deg, transparent 49.5%,
      #777 50%, transparent 50.5%),
      linear-gradient(-45deg, transparent 49.5%,
      #777 50%, transparent 50.5%);
}
.photo-area input {
    max-width: 145px;
    font-size: 11px;
    margin-top: 5px;
}
.details {
    flex: 1;
    min-width: 0;
}
.row {
    display: grid;
    grid-template-columns: 130px minmax(0, 1fr);
    gap: 8px;
    margin-bottom: 12px;
    align-items: start;
}
.row > label {
    font-size: 12px;
    padding-top: 5px;
}
input:not([type="checkbox"]):not([type="file"]),
select, textarea {
    box-sizing: border-box;
    width: 100%;
    padding: 5px;
    font-size: 13px;
}
textarea { resize: vertical; }
.checks label {
    display: block;
    margin: 6px 0;
    font-size: 12px;
}
.submit {
    text-align: center;
    margin-top: 20px;
}
button {
    color: white;
    background: green;
    border: 0;
    padding: 9px 16px;
    cursor: pointer;
}
@media (max-width: 520px) {
    body { margin: 6px; }
    .container { padding: 10px; }
    .product { flex-direction: column; }
    .photo-area { width: 100%; }
    .row { grid-template-columns: 1fr; gap: 4px; }
    nav a { font-size: 11px; }
}
</style>
</head>

<body>
<div class="container">

<nav>
<a href="#">Home</a>
<a href="#">Generate Link</a>
<a href="#">Transaction History</a>
<a href="#">Policy</a>
<a href="#">Logout</a>
</nav>

<form action="hasil_pemesanan.html" method="get">
<div class="product">

<div class="photo-area">
<div class="photo"></div>
<input type="file" name="foto" accept="image/*">
</div>

<div class="details">

<div class="row">
<label for="nama">Title Here:</label>
<input id="nama" name="nama_barang"
value="MacBook Air E800" required>
</div>

<div class="row">
<label for="deskripsi">Description:</label>
<textarea id="deskripsi" name="deskripsi"
rows="4">Year: 2004
Model:
Condition: Mint</textarea>
</div>

<div class="row">
<label for="jumlah">Total Amount:</label>
<input id="jumlah" name="total"
value="£800" required>
</div>

<div class="row">
<label for="rekening">Account Number:</label>
<input id="rekening" name="rekening"
value="123-456-789-0" required>
</div>

<div class="row">
<label for="bank">Bank:</label>
<select id="bank" name="bank">
<option>HSBC</option>
<option>Visa Debit</option>
<option>BCA</option>
<option>BRI</option>
<option>Mandiri</option>
</select>
</div>

<div class="row">
<label for="pemilik">Account Holder:</label>
<input id="pemilik" name="pemilik"
placeholder="Nama pemilik rekening" required>
</div>

<div class="row">
<label for="transaksi">Transaction:</label>
<div>
<select id="transaksi" name="transaksi">
<option value="1">1</option>
<option value="2">2</option>
<option value="3">3</option>
</select>

<div class="checks">
<label>
<input type="checkbox" name="layanan"
value="Mobile Phone" checked>
Send to Mobile Phone
</label>
<label>
<input type="checkbox" name="layanan"
value="Email" checked>
Send to Email
</label>
</div>
</div>
</div>

<div class="row">
<label for="telepon">Send to Mobile Phone:</label>
<input id="telepon" type="tel" name="telepon"
placeholder="08xxxxxxxxxx" required>
</div>

<div class="row">
<label for="email">Send to Email:</label>
<input id="email" type="email" name="email"
placeholder="nama@email.com" required>
</div>

</div>
</div>

<div class="submit">
<button type="submit">Generate Link</button>
</div>

</form>
</div>
</body>
</html>
