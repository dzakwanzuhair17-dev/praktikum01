<!DOCTYPE html>
<html>

  <title>Belajar Form</title>

<body>
 <h1>Form Pemesanan Pizza</h1>
 <p>Silahkan isi form pemesanan ini dengan lengkap dan benar</p>
 <form action="#" method="post">
   <fieldset class="">
     <legend>Informasi Pemesanan</legend>
     <p>
       <label for="costomername">Nama:</label>
       <input type="text" name="costomername" id="costomername" required />
     </p>  
     <p>
       <label for="address">Address:</label>
       <input type="text" name="address" id="address" required />
     </p> 
     <p>
       <label for="telephone">Telephone:</label>

     </p> 
     <p>
       <label for="email">Email:</label>
       <input type="email" name="email" id="email" required />
     </p>
     <p>
       <label for="instruction">delivery instruction:</label><br />
       <textarea  name="instruction" id="instruction" rows="4" cols="50" maxlength="400" placeholder="no more
       than 400 characters"></textarea>
     </p>
   </fieldset>
   
   <fieldset>

 </form>
